<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yıl Kaç?</title>
<meta name="description" content="Tarihten kartları çizelgende doğru sıraya koy, yılı tahmin et. Her gün herkes için aynı deste.">
<meta property="og:title" content="Yıl Kaç?">
<meta property="og:description" content="Tarihten kartları çizelgende doğru sıraya koy, yılı tahmin et. Her gün herkes için aynı deste.">
<meta name="theme-color" content="#F5F6F9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* A card table: soft pastel light, portrait playing cards tinted by kind (art, building, science, event),
   one horizontal timeline you drop cards into. Cobalt is the only interface accent; green/red mean right/wrong. */
:root{
  --bg:#F5F6F9;
  --card:#FFFFFF;
  --ink:#141C33;
  --muted:#67708A;
  --line:#DCE1EA;
  --accent:#3B5BFF; --accent-press:#2C47D9; --accent-soft:#E8ECFF;
  --ok:#0E9F63; --ok-soft:#E2F5EB;
  --bad:#E5484D; --bad-soft:#FDECEC;
  --heart:#F0506E;
  --pill:#2B3242;
  --shadow:0 1px 2px rgba(20,28,51,.06), 0 10px 28px -14px rgba(20,28,51,.22);
  --card-shadow:0 1px 2px rgba(20,28,51,.08), 0 12px 24px -14px rgba(20,28,51,.35);
  --font:'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --cw:148px; --ch:204px;     /* timeline card */
  --bw:212px; --bh:292px;     /* card in hand */
  color-scheme:light;
}
html{box-sizing:border-box;min-height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 32% at 12% 8%, rgba(255,214,186,.55), transparent 70%),
    radial-gradient(34% 30% at 88% 12%, rgba(196,210,255,.55), transparent 70%),
    radial-gradient(40% 36% at 78% 92%, rgba(255,205,220,.40), transparent 70%),
    radial-gradient(42% 38% at 18% 88%, rgba(196,236,216,.50), transparent 70%)}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}
.app{max-width:1120px;margin:0 auto;padding:14px 16px 32px;padding-top:max(14px,env(safe-area-inset-top))}

/* buttons */
.btn{border:0;border-radius:999px;padding:14px 26px;font-weight:700;font-size:1.02rem;background:var(--accent);color:#fff;transition:background .15s,transform .08s,opacity .15s}
.btn:hover{background:var(--accent-press)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;transform:none;background:var(--accent)}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.soft:hover{box-shadow:inset 0 0 0 1.5px var(--muted)}
.btn.text{background:none;color:var(--muted);padding-inline:12px}
.btn.text:hover{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;min-height:40px}
.brand{font-weight:800;font-size:1.3rem;letter-spacing:-.02em;background:none;border:0;padding:0}
.start-on .brand{visibility:hidden}
.tools{display:flex;gap:8px;align-items:center}
.pill-seg{display:inline-flex;background:rgba(228,232,240,.85);border-radius:999px;padding:3px}
.pill-seg button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:700;color:var(--muted)}
.pill-seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,28,51,.14)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:rgba(228,232,240,.85);display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.icon-btn[aria-pressed="false"]{color:#A3AABB}

/* start */
.start{display:grid;gap:28px;justify-items:center;text-align:center;padding-top:2vh}
.hero{display:grid;gap:18px;justify-items:center}
.fan{position:relative;width:300px;height:156px;margin-bottom:4px}
.fan .mc{position:absolute;left:50%;top:10px;width:104px;height:132px;margin-left:-52px;background:var(--tint);border-radius:14px;box-shadow:var(--card-shadow), inset 0 0 0 1.5px var(--edge);padding:7px;display:grid;grid-template-rows:1fr auto;gap:6px;transform-origin:50% 120%;animation:fan .9s cubic-bezier(.2,.9,.25,1.15) .15s backwards}
.fan .mc i{border-radius:9px;display:block}
.fan .mc b{font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.fan .mc:nth-child(1){--tint:#F6E9CF;--edge:#E6D3AB;transform:translate(-78px,12px) rotate(-11deg)}
.fan .mc:nth-child(1) i{background:linear-gradient(160deg,#FFD39A,#F08A5D)}
.fan .mc:nth-child(2){--tint:#DDE8F8;--edge:#BCD0EE;transform:translateY(-8px);z-index:2}
.fan .mc:nth-child(2) i{background:linear-gradient(160deg,#9DB4FF,#3B5BFF)}
.fan .mc:nth-child(3){--tint:#DFF1E6;--edge:#B9DEC8;transform:translate(78px,12px) rotate(11deg)}
.fan .mc:nth-child(3) i{background:linear-gradient(160deg,#B7E9D2,#2FB57C)}
@keyframes fan{from{transform:none}}
.wordmark{font-weight:800;font-size:clamp(3.2rem,13vw,5.6rem);line-height:.95;letter-spacing:-.045em;margin:0}
.lede{max-width:36ch;color:var(--muted);font-size:1.1rem;line-height:1.5;margin:0}
.menu{width:100%;max-width:520px;display:grid;gap:14px;text-align:left}
.panel{background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-radius:22px;box-shadow:var(--shadow);padding:22px;display:grid;gap:14px}
.panel h2{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.panel p{margin:0;color:var(--muted);line-height:1.5}
.panel p b{color:var(--ink);font-weight:600}
.daily-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.streak{font-weight:700;color:var(--heart);white-space:nowrap}
.free-head button{background:none;border:0;padding:0;text-align:left;font-size:1.35rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;width:100%;justify-content:space-between}
.free-head svg{width:20px;height:20px;color:var(--muted);transition:transform .2s}
.free-head button[aria-expanded="true"] svg{transform:rotate(180deg)}
.free-body{display:grid;gap:16px}
.field{display:grid;gap:8px}
.flabel{font-size:.86rem;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:999px;padding:8px 14px;background:var(--bg);font-size:.92rem;font-weight:500;color:var(--ink)}
.chip small{color:var(--muted);margin-left:6px;font-size:.8rem}
.chip:hover{background:#E6EAF2}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.75)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,28,51,.14)}
.fnote{font-size:.9rem}
.free-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.free-foot .meta{color:var(--muted);font-size:.9rem}
.status{color:var(--muted);font-size:.95rem;min-height:1.4em;text-align:center}
.status.err{color:var(--bad)}
.loadbar{height:4px;width:160px;margin:6px auto 0;border-radius:4px;background:var(--accent-soft);overflow:hidden;position:relative}
.loadbar::after{content:"";position:absolute;inset:0;width:40%;border-radius:4px;background:var(--accent);animation:slide 1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* ---------- game card ---------- */
.gcard{position:relative;width:var(--cw);height:var(--ch);border-radius:16px;padding:11px;background:var(--tint,#EEF1F6);box-shadow:var(--card-shadow), inset 0 0 0 1.5px var(--edge,#D9DEE8);display:flex;flex-direction:column;gap:3px;text-align:left;color:var(--ink);border:0}
.gcard .t{font-weight:700;font-size:.92rem;line-height:1.2;letter-spacing:-.005em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.gcard .k{font-size:.74rem;color:rgba(20,28,51,.55);font-weight:500}
.gcard .im{margin-top:auto;flex:1;min-height:0;max-height:62%;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.55);position:relative}
.gcard .im img{display:block;width:100%;height:100%;object-fit:cover;animation:fadein .35s ease}
.gcard .im.empty::after{content:"";position:absolute;inset:0;margin:auto;width:26px;height:26px;border-radius:50%;border:3px solid rgba(20,28,51,.12);border-top-color:var(--accent);animation:spin .9s linear infinite}
.gcard .im.noimg::after{display:none}
.gcard.big{--cw:var(--bw);--ch:var(--bh);padding:14px;border-radius:20px;gap:4px}
.gcard.big .t{font-size:1.12rem}
.gcard.big .k{font-size:.82rem}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- play ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.hearts{display:flex;gap:4px}
.hearts i{font-style:normal;font-size:1.3rem;line-height:1;color:var(--heart)}
.hearts i.off{color:#D3D8E2}
.hearts i.lost{animation:hit .55s}
@keyframes hit{0%{transform:scale(1.6)}40%{transform:scale(.8)}100%{transform:none}}
.score{display:flex;align-items:baseline;gap:5px;font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.score span{color:var(--muted);font-weight:500;font-size:.92rem}
.mode-tag{color:var(--muted);font-size:.9rem;font-weight:500}
.stage{min-height:calc(var(--bh) + 76px);display:grid;justify-items:center;align-content:start;gap:12px;padding-top:6px}
.hand{position:relative;touch-action:none;cursor:grab;transform:rotate(-2deg);transition:transform .25s, opacity .2s}
.hand:hover{transform:rotate(-1deg) translateY(-3px)}
.hand.draw{animation:draw .5s cubic-bezier(.2,.9,.25,1.1)}
@keyframes draw{from{transform:translateY(-30px) rotate(6deg);opacity:0}}
.hand.lifted{opacity:.25}
.hand .gcard{box-shadow:0 2px 4px rgba(20,28,51,.08), 0 24px 40px -18px rgba(20,28,51,.45), inset 0 0 0 1.5px var(--edge)}
.hint{margin:0;color:var(--muted);text-align:center;max-width:34ch;font-size:.95rem}
.drag-ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%) rotate(4deg) scale(.82);transition:transform .12s}
.drag-ghost .gcard{box-shadow:0 30px 50px -18px rgba(20,28,51,.55), inset 0 0 0 1.5px var(--edge)}

/* result / year panel */
.res{width:100%;max-width:460px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:22px;box-shadow:var(--shadow);padding:18px 20px;display:grid;gap:10px;text-align:center;justify-items:center;animation:pop .3s cubic-bezier(.2,.9,.25,1.2)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.res .badge{font-weight:700;font-size:.95rem;padding:5px 12px;border-radius:999px}
.res .badge.ok{background:var(--ok-soft);color:var(--ok)}
.res .badge.bad{background:var(--bad-soft);color:var(--bad)}
.res .badge.year{background:var(--accent-soft);color:var(--accent)}
.res h3{margin:0;font-size:1.2rem;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.res .big-y{font-weight:800;font-size:2.6rem;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.res .big-y.ok{color:var(--ok)} .res .big-y.bad{color:var(--bad)} .res .big-y.ask{color:var(--accent)}
.res .sub{margin:0;color:var(--muted);font-size:.95rem}
.res .sub b{color:var(--ink)}
.res .fact{margin:0;font-size:.95rem;line-height:1.55;color:#3D4660;text-align:left}
.res .btn{min-width:200px}
.res.quick{cursor:pointer;gap:6px;padding:16px 22px;max-width:360px}
.res .bar{height:4px;width:100%;border-radius:4px;background:var(--bg);overflow:hidden}
.res .bar i{display:block;height:100%;width:100%;background:currentColor;transform-origin:left center;animation:drain var(--wait,1s) linear forwards}
.res.okc .bar{color:var(--ok)} .res.badc .bar{color:var(--bad)}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.quick-row{display:grid;justify-items:center;gap:8px;padding:2px 6px;text-align:center}
.quick-row .meta{color:var(--muted);font-size:.88rem;max-width:34ch}

/* timeline row */
.tl-bar{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 0;color:var(--muted);font-size:.88rem;font-weight:500}
.tl-bar b{color:var(--ink);font-weight:700}
.rowwrap{display:flex;overflow-x:auto;overflow-y:hidden;margin:0 -16px;padding:12px 16px 18px;scroll-behavior:smooth;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.rowwrap.dragging{scroll-behavior:auto}
.trow{display:flex;align-items:flex-start;margin:0 auto;padding:0 4px}
.titem{flex:none;display:grid;justify-items:center;gap:8px;scroll-margin:80px}
.titem .gcard{cursor:pointer}
.titem.new .gcard{animation:landed .6s cubic-bezier(.2,.9,.25,1.25)}
@keyframes landed{0%{transform:translateY(-40px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.titem.new.ok .gcard{box-shadow:var(--card-shadow), inset 0 0 0 1.5px var(--edge), 0 0 0 3px var(--ok)}
.titem.new.bad .gcard{box-shadow:var(--card-shadow), inset 0 0 0 1.5px var(--edge), 0 0 0 3px var(--bad)}
.ypill{min-width:66px;padding:5px 12px;border-radius:10px;font-weight:700;font-size:.95rem;color:#fff;background:var(--pill);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.ypill.ok{background:var(--ok)} .ypill.bad{background:var(--bad)} .ypill.q{background:#A3AABB}
.gap{flex:none;width:30px;height:var(--ch);border:0;background:none;padding:0;position:relative;display:grid;place-items:center;transition:width .22s cubic-bezier(.2,.9,.25,1)}
.gap::before{content:"";position:absolute;top:10px;bottom:10px;left:50%;width:2px;margin-left:-1px;border-radius:2px;background:rgba(20,28,51,.08)}
.gap i{position:relative;font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(20,28,51,.18);display:grid;place-items:center;font-weight:700;color:var(--accent);font-size:1rem;line-height:1;transition:transform .15s}
.gap:hover i{transform:scale(1.15)}
.gap .ghost{display:none}
.gap.on{width:calc(var(--cw) + 20px)}
.gap.on::before{display:none}
.gap.on i{display:none}
.gap.on .ghost{display:flex;align-items:center;justify-content:center;width:var(--cw);height:var(--ch);border-radius:16px;border:2.5px dashed var(--accent);background:rgba(232,236,255,.75);color:var(--accent);font-weight:700;font-size:.9rem;padding:10px;text-align:center;line-height:1.25}
.trow.locked .gap{width:12px}
.trow.locked .gap i,.trow.locked .gap::before{display:none}

/* ---------- over ---------- */
.over{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){ .over{grid-template-columns:1fr} }
.over-main{display:grid;gap:18px}
.over-card{background:rgba(255,255,255,.92);border-radius:24px;box-shadow:var(--shadow);padding:26px;display:grid;gap:14px;justify-items:start}
.over-card .head{color:var(--muted);font-weight:500}
.big-total{font-weight:800;font-size:clamp(4rem,16vw,6.5rem);line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:var(--accent)}
.big-total small{display:block;font-size:1.05rem;letter-spacing:0;color:var(--ink);font-weight:600;margin-top:8px}
.squares{font-size:1.3rem;letter-spacing:.08em;line-height:1.35;white-space:pre-line}
.over-note{color:var(--muted);margin:0}
.daily-box{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:baseline;color:var(--muted)}
.daily-box strong{color:var(--ink);font-variant-numeric:tabular-nums}
.copied{min-height:1.3em;color:var(--ok);font-size:.92rem;white-space:pre-line}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 10px}
.tl-head h3{margin:0;font-size:1rem;font-weight:700}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li button{width:100%;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:rgba(255,255,255,.92);border:0;border-radius:14px;padding:6px 12px 6px 6px;text-align:left;box-shadow:0 1px 2px rgba(20,28,51,.06)}
.list .th{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--tint,#E9EDF4);display:block}
.list .nm{font-size:.95rem;line-height:1.3;overflow-wrap:anywhere}
.list .nm small{display:block;color:var(--muted);font-size:.8rem}
.list .ypill{font-size:.88rem;min-width:58px}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(20,28,51,.45);display:grid;place-items:center;padding:16px;animation:fadein .2s}
.sheet{background:var(--card);border-radius:24px;max-width:540px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:10px;box-shadow:var(--shadow)}
.sheet .pic{position:relative;aspect-ratio:4/3;background:#E9EDF4;border-radius:16px;overflow:hidden}
.sheet .pic img{display:block;width:100%;height:100%;object-fit:contain}
.sheet .pic .blur{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(24px);opacity:.55}
.sheet .pic img{position:relative}
.sheet .body{padding:14px 12px 10px;display:grid;gap:10px}
.sheet .body p{margin:0;line-height:1.6}
.sheet .yr{font-weight:800;font-size:1.5rem;color:var(--accent)}
.sheet h2{margin:0;font-size:1.4rem;font-weight:700;letter-spacing:-.015em}
.sheet .fact{font-weight:500}
.sheet .extract{color:var(--muted)}
.sheet .links{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;font-size:.95rem}
.sheet .links a + a{color:var(--muted);font-weight:500}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,14,26,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.enter{animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:640px){
  :root{--cw:122px;--ch:172px;--bw:176px;--bh:244px}
  .gcard{padding:9px;border-radius:14px}
  .gcard .t{font-size:.82rem}
  .gcard .k{font-size:.68rem}
  .gcard.big .t{font-size:1rem}
  .gap{width:26px}
  .res{padding:16px}
  .res .big-y{font-size:2.2rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body class="start-on">
<div class="app">
  <header class="topbar">
    <button class="brand" id="brand">Yıl Kaç?</button>
    <div class="tools">
      <div class="pill-seg" id="langSeg" role="group" aria-label="Dil / Language"><button data-lang="tr">TR</button><button data-lang="en">EN</button></div>
      <button class="icon-btn" id="soundBtn"></button>
    </div>
  </header>

  <section id="start" class="start">
    <div class="hero">
      <div class="fan" aria-hidden="true">
        <div class="mc"><i></i><b>1453</b></div>
        <div class="mc"><i></i><b>1889</b></div>
        <div class="mc"><i></i><b>1969</b></div>
      </div>
      <h1 class="wordmark">Yıl Kaç?</h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <div class="menu">
      <div class="panel daily">
        <div class="daily-top"><h2 id="dHead"></h2><span class="streak" id="streakLine"></span></div>
        <p id="dState"></p>
        <button class="btn" id="dailyBtn"></button>

// p: sayfanın kendi görseli uygun değilse Wikimedia Commons dosya adı, f / fe: Türkçe / İngilizce kısa bilgi
const EVENTS = [{"id":"istanbul","y":1453,"t":"İstanbul'un Fethi","te":"Fall of Constantinople","en":"Fall of Constantinople","f":"Fatih şehri aldığında 21 yaşındaydı. Haliç'i kapatan zinciri aşmak için gemileri karadan yürütüp Haliç'e indirmesi kuşatmanın en ünlü hamlesi oldu.","fe":"Mehmed II was 21 when he took the city. His most famous move was hauling ships overland into the Golden Horn to get around the chain blocking it."},{"id":"ay","y":1969,"t":"Ay'a ilk iniş","te":"First Moon landing","en":"Apollo 11","f":"Neil Armstrong ve Buzz Aldrin Ay yüzeyinde yaklaşık iki buçuk saat yürüdü. Yayını dünya genelinde yüz milyonlarca kişi canlı izledi.","fe":"Neil Armstrong and Buzz Aldrin spent about two and a half hours walking on the Moon. Hundreds of millions of people watched the broadcast live."},{"id":"bastille","y":1789,"t":"Bastille Baskını","te":"Storming of the Bastille","en":"Storming of the Bastille","f":"Fransız Devrimi'nin sembolü olan baskının yıldönümü, 14 Temmuz, bugün Fransa'nın ulusal bayramı. İçeride o gün yalnızca yedi mahkum vardı.","fe":"The anniversary, 14 July, is now France's national day. On the day it was stormed, the fortress held only seven prisoners."},{"id":"kolomb","y":1492,"t":"Kolomb Amerika'ya ulaşıyor","te":"Columbus reaches the Americas","en":"Voyages of Christopher Columbus","p":"Landing of Columbus (2) (cropped).jpg","f":"Kolomb Asya'ya batıdan ulaşmayı hedefliyordu ve ömrü boyunca yeni bir kıtaya vardığını kabul etmedi. Aynı yıl Gırnata'nın düşüşüyle Endülüs'teki son Müslüman devlet de sona erdi.","fe":"Columbus was trying to reach Asia by sailing west and never accepted that he had found a new continent. The same year, the fall of Granada ended Muslim rule in Iberia."},{"id":"berlin","y":1989,"t":"Berlin Duvarı'nın yıkılışı","te":"Fall of the Berlin Wall","en":"Fall of the Berlin Wall","f":"Duvar 28 yıl boyunca şehri ikiye böldü. Sınır kapıları, bir yetkilinin basın toplantısındaki yanlış açıklamasından sonra kalabalığın baskısıyla açıldı.","fe":"The wall split the city for 28 years. The gates opened after an official's botched announcement at a press conference sent crowds to the border."},{"id":"berlinkurulus","y":1961,"t":"Berlin Duvarı örülüyor","te":"Berlin Wall goes up","en":"Berlin Wall"},{"id":"titanic","y":1912,"t":"Titanic'in batışı","te":"Sinking of the Titanic","en":"Sinking of the Titanic","f":"Gemi ilk seferinde Southampton'dan New York'a gidiyordu. Filikalar yolcuların yarısını bile taşımaya yetmiyordu ve 1500'den fazla kişi hayatını kaybetti.","fe":"The ship was on her maiden voyage from Southampton to New York. The lifeboats could not hold even half the people on board, and more than 1,500 died."},{"id":"malazgirt","y":1071,"t":"Malazgirt Meydan Muharebesi","te":"Battle of Manzikert","en":"Battle of Manzikert","f":"Alparslan, Bizans İmparatoru Romen Diyojen'i esir aldı ama serbest bıraktı. Savaş, Anadolu'nun kapılarını Türklere açan dönüm noktası sayılır.","fe":"Alp Arslan captured the Byzantine emperor Romanos IV and then let him go. The battle is seen as the turning point that opened Anatolia to the Turks."},{"id":"tbmm","y":1920,"t":"TBMM'nin açılışı","te":"Turkish Grand National Assembly opens","en":"Grand National Assembly of Turkey","p":"Mustafa Kemal Pasha in the Turkish Grand National Assembly, 1 March 1921.jpg","f":"Meclis 23 Nisan'da Ankara'da açıldı. Bu tarih bugün Ulusal Egemenlik ve Çocuk Bayramı olarak kutlanıyor.","fe":"The assembly opened in Ankara on 23 April. Turkey still celebrates that date as National Sovereignty and Children's Day."},{"id":"canakkale","y":1915,"t":"Çanakkale Savaşı","te":"Gallipoli campaign","en":"Gallipoli campaign","p":"Landing of Australian troops at ANZAC Cove, 25 April 1915 slnsw.jpg","f":"18 Mart'ta boğazı geçmeye çalışan İtilaf donanması, Nusret'in döktüğü mayınlar yüzünden ağır kayıp verdi. Ardından aylarca süren kara savaşları başladı.","fe":"On 18 March the Allied fleet trying to force the strait lost several ships to mines laid by the Nusret. Months of land battles followed."},{"id":"eyfel","y":1889,"t":"Eyfel Kulesi tamamlanıyor","te":"Eiffel Tower completed","en":"Eiffel Tower","f":"Kule Paris Dünya Fuarı için yapıldı ve 20 yıl sonra sökülmesi planlanıyordu. Telsiz anteni olarak işe yaradığı için yerinde kaldı.","fe":"The tower was built for the Paris World's Fair and was meant to come down after 20 years. It survived because it was useful as a radio antenna."},{"id":"bagimsizlik","y":1776,"t":"ABD Bağımsızlık Bildirgesi","te":"US Declaration of Independence","en":"Declaration of Independence (painting)","p":"Declaration of Independence (1819), by John Trumbull.jpg","f":"Bildirgeyi büyük ölçüde Thomas Jefferson yazdı. Jefferson, bildirgenin tam 50. yıldönümünde, 4 Temmuz'da öldü.","fe":"Thomas Jefferson wrote most of the Declaration. He died on 4 July 1826, exactly 50 years later."},{"id":"cernobil","y":1986,"t":"Çernobil faciası","te":"Chernobyl disaster","en":"Chernobyl disaster","f":"Patlama bir güvenlik testi sırasında oldu. Yakındaki Pripyat kenti boşaltıldı ve bugün hâlâ terk edilmiş durumda.","fe":"The explosion happened during a safety test. The nearby town of Pripyat was evacuated and is still abandoned today."},{"id":"iphone","y":2007,"t":"İlk iPhone tanıtılıyor","te":"First iPhone unveiled","en":"IPhone (1st generation)","p":"IPhone First Generation 8GB (3677961514).jpg","f":"Jobs telefonu \"bir iPod, bir telefon ve bir internet cihazı\" diye tanıttı. İlk modelde uygulama mağazası bile yoktu.","fe":"Jobs introduced it as \"an iPod, a phone and an internet communicator.\" The first model did not even have an App Store."},{"id":"monalisa","y":1503,"t":"Leonardo Mona Lisa'ya başlıyor","te":"Leonardo begins the Mona Lisa","en":"Mona Lisa","f":"Leonardo tablo üzerinde yıllarca çalıştı ve onu hiç sahibine teslim etmedi. Tablo asıl şöhretini 1911'de Louvre'dan çalınmasıyla kazandı.","fe":"Leonardo worked on the painting for years and never delivered it. It became truly famous after it was stolen from the Louvre in 1911."},{"id":"napolyontac","y":1804,"t":"Napolyon'un taç giymesi","te":"Coronation of Napoleon","en":"The Coronation of Napoleon","f":"Tören için Papa VII. Pius Paris'e getirildi ama Napolyon tacı kendi eliyle başına koydu. Ressam Jacques-Louis David bu anı devasa bir tabloya dönüştürdü.","fe":"Pope Pius VII was brought to Paris for the ceremony, but Napoleon placed the crown on his own head. Jacques-Louis David turned the moment into a huge painting."},{"id":"waterloo","y":1815,"t":"Waterloo Muharebesi","te":"Battle of Waterloo","en":"Battle of Waterloo","f":"Napolyon'un sürgünden dönüp yeniden iktidara geldiği \"Yüz Gün\" bu savaşla bitti. Ardından Atlantik'teki Saint Helena adasına sürgün edildi.","fe":"The battle ended the Hundred Days, Napoleon's return from exile. He was then sent to the island of Saint Helena in the Atlantic."},{"id":"moskova","y":1812,"t":"Napolyon'un Rusya seferi","te":"Napoleon's invasion of Russia","en":"French invasion of Russia","f":"Napolyon şehri neredeyse boş ve yanarken buldu. Kış bastırınca geri çekilmek zorunda kaldı ve dev ordusunun büyük kısmını kaybetti.","fe":"Napoleon found Moscow nearly empty and burning. When winter came he had to retreat and lost most of his huge army."},{"id":"gutenberg","y":1455,"a":1,"t":"Gutenberg İncili basılıyor","te":"Gutenberg Bible printed","en":"Gutenberg Bible","f":"Hareketli metal harflerle basılan ilk büyük kitaptır. Bugün dünyada tam ya da eksik yaklaşık 49 kopyası kaldı.","fe":"It was the first major book printed with movable metal type. About 49 copies, complete or partial, survive today."},{"id":"magna","y":1215,"t":"Magna Carta mühürleniyor","te":"Magna Carta sealed","en":"Magna Carta","f":"Kralın yetkilerini ilk kez yazılı olarak sınırlayan belgedir. Kral John onu imzalamadı, mühürledi, ve birkaç ay sonra Papa belgeyi geçersiz ilan etti.","fe":"It was the first document to put the king's power in writing. King John never signed it, he sealed it, and the Pope annulled it a few months later."},{"id":"viyana","y":1529,"t":"Birinci Viyana Kuşatması","te":"First Siege of Vienna","en":"Siege of Vienna (1529)","f":"Osmanlı ordusu şehre ulaştığında mevsim çok ilerlemişti ve ağır toplar yağmur yüzünden geride kalmıştı. Kuşatma birkaç hafta sonra kaldırıldı.","fe":"The Ottoman army arrived very late in the season and its heavy guns were left behind because of the rain. The siege was lifted after a few weeks."},{"id":"viyana2","y":1683,"t":"İkinci Viyana Kuşatması","te":"Second Siege of Vienna","en":"Battle of Vienna"},{"id":"wright","y":1903,"t":"Wright Kardeşler'in ilk uçuşu","te":"Wright brothers' first flight","en":"Wright Flyer","f":"İlk uçuş 12 saniye sürdü ve yaklaşık 37 metre gidildi. Bu, bugünkü bir Boeing 747'nin kanat açıklığından bile kısa.","fe":"The first flight lasted 12 seconds and covered about 37 metres, less than the wingspan of a Boeing 747."},{"id":"pompeii","y":79,"t":"Vezüv'ün Pompeii'yi gömmesi","te":"Vesuvius buries Pompeii","en":"Eruption of Mount Vesuvius in 79 AD","f":"Kent yaklaşık 1700 yıl boyunca küllerin altında kaldı. Küller o kadar iyi korudu ki duvar yazıları ve fırındaki ekmekler bile bugüne ulaştı.","fe":"The town stayed buried under ash for about 1,700 years. The ash preserved it so well that wall graffiti and loaves of bread in ovens survived."},{"id":"sezar","y":-44,"t":"Jül Sezar'ın öldürülmesi","te":"Assassination of Julius Caesar","en":"Assassination of Julius Caesar","f":"Suikast 15 Mart'ta oldu ve suikastçıların arasında yakın dostu Brutus da vardı. Sezar'ın ölümü Roma Cumhuriyeti'nin sonunu hızlandırdı.","fe":"He was killed on the Ides of March, and his close friend Brutus was among the assassins. His death sped up the end of the Roman Republic."},{"id":"ayasofya","y":537,"t":"Ayasofya açılıyor","te":"Hagia Sophia opens","en":"Hagia Sophia","f":"İmparator I. Justinianus onu yaklaşık beş yılda inşa ettirdi. Yaklaşık bin yıl boyunca dünyanın en büyük katedrali olarak kaldı.","fe":"Emperor Justinian I had it built in about five years. It remained the largest cathedral in the world for nearly a thousand years."},{"id":"suveys","y":1869,"t":"Süveyş Kanalı'nın açılışı","te":"Suez Canal opens","en":"Suez Canal","f":"Kanal, Avrupa ile Asya arasındaki deniz yolunu Afrika'yı dolaşmaya gerek bırakmadan binlerce kilometre kısalttı. İnşaatı Fransız Ferdinand de Lesseps'in şirketi on yılda bitirdi.","fe":"The canal cut thousands of kilometres off the sea route between Europe and Asia, with no need to sail around Africa. Ferdinand de Lesseps' company took ten years to build it."},{"id":"panama","y":1914,"t":"Panama Kanalı'nın açılışı","te":"Panama Canal opens","en":"Panama Canal","p":"SS Ancon (1902 ship) NARA 185-G-0882 cropped.jpg","f":"İlk deneyen Fransızlar sıtma ve sarı humma yüzünden binlerce işçi kaybedip vazgeçti. İşi ABD tamamladı ve kanal ancak 1999'da Panama'ya devredildi.","fe":"The French tried first and gave up after losing thousands of workers to malaria and yellow fever. The US finished it, and handed it to Panama only in 1999."},{"id":"olimpiyat","y":1896,"t":"İlk modern Olimpiyatlar","te":"First modern Olympic Games","en":"Spyridon Louis","f":"Oyunlara 14 ülkeden yaklaşık 240 sporcu katıldı ve hepsi erkekti. Kazananlara altın değil gümüş madalya verildi.","fe":"About 240 athletes from 14 countries took part, all of them men. Winners received silver medals, not gold."},{"id":"harf","y":1928,"t":"Harf Devrimi","te":"Turkish alphabet reform","en":"Turkish alphabet reform","p":"Ataturk-September 20, 1928.jpg","f":"Yeni alfabeyi halka öğretmek için Millet Mektepleri açıldı. Atatürk yeni harfleri bizzat kara tahta başında tanıttı.","fe":"Nation Schools were opened to teach the new alphabet to the public. Atatürk introduced the new letters himself at a blackboard."},{"id":"everest","y":1953,"t":"Everest'e ilk tırmanış","te":"First ascent of Everest","en":"1953 British Mount Everest expedition","f":"Zirveye Yeni Zelandalı Edmund Hillary ile Şerpa Tenzing Norgay birlikte ulaştı. Haber, II. Elizabeth'in taç giyme töreninin sabahı duyuruldu.","fe":"New Zealander Edmund Hillary and Sherpa Tenzing Norgay reached the summit together. The news broke on the morning of Elizabeth II's coronation."},{"id":"sputnik","y":1957,"t":"Sputnik 1 fırlatılıyor","te":"Sputnik 1 launched","en":"Sputnik 1","f":"Sputnik bir plaj topu büyüklüğündeydi ve yalnızca bip sesleri gönderiyordu. ABD'de büyük bir şaşkınlık yarattı ve uzay yarışını başlattı.","fe":"Sputnik was about the size of a beach ball and only sent out beeps. It shocked the US and started the space race."},{"id":"yildizligece","y":1889,"t":"Van Gogh, Yıldızlı Gece","te":"Van Gogh, The Starry Night","en":"The Starry Night","f":"Van Gogh tabloyu kaldığı hastanedeki odasının penceresinden gördüğü manzaradan yola çıkarak yaptı. Hayatı boyunca neredeyse hiç tablo satamadı.","fe":"Van Gogh based it on the view from his room at the asylum where he was staying. He sold almost no paintings in his lifetime."},{"id":"tutankamon","y":1922,"t":"Tutankamon'un mezarının bulunuşu","te":"Tutankhamun's tomb discovered","en":"Discovery of the tomb of Tutankhamun","f":"Arkeolog Howard Carter mezarı neredeyse el değmemiş hâlde buldu. İçinden çıkan altın maske, dünyanın en ünlü arkeolojik eserlerinden biri oldu.","fe":"Howard Carter found the tomb almost untouched. Its gold mask became one of the most famous archaeological finds in the world."},{"id":"dumlupinar","y":1922,"t":"Büyük Taarruz","te":"Turkish Great Offensive","en":"Battle of Dumlupınar","f":"26 Ağustos'ta başlayan taarruz, 30 Ağustos'taki Başkomutanlık Meydan Muharebesi ile zafere ulaştı. Bu tarih bugün Zafer Bayramı olarak kutlanıyor.","fe":"The offensive began on 26 August and ended in victory at the Battle of Dumlupınar on 30 August, now celebrated in Turkey as Victory Day."},{"id":"perseverance","y":2021,"t":"Perseverance Mars'a iniyor","te":"Perseverance lands on Mars","en":"Perseverance (rover)","f":"Araç yanında küçük bir helikopter de götürdü. Ingenuity adlı bu helikopter, başka bir gezegende uçan ilk motorlu araç oldu.","fe":"The rover carried a small helicopter. Ingenuity became the first powered aircraft to fly on another planet."},{"id":"modelt","y":1908,"t":"Ford Model T satışa çıkıyor","te":"Ford Model T goes on sale","en":"Ford Model T","f":"Model T, hareketli montaj hattı sayesinde ucuzladı ve orta sınıfın arabası oldu. Henry Ford'un \"Rengi siyah olduğu sürece her renk olur\" dediği anlatılır.","fe":"The moving assembly line made the Model T cheap enough for the middle class. Ford is said to have offered it in \"any color, so long as it is black.\""},{"id":"sistina","y":1512,"t":"Sistina Şapeli tavanı tamamlanıyor","te":"Sistine Chapel ceiling completed","en":"Sistine Chapel ceiling","f":"Michelangelo kendini ressam değil heykeltıraş olarak görüyordu ve işi isteksizce kabul etti. Tavanı dört yılda, iskele üstünde ayakta çalışarak boyadı.","fe":"Michelangelo saw himself as a sculptor, not a painter, and took the job reluctantly. He painted the ceiling in four years, standing on scaffolding."},{"id":"misir","y":1798,"t":"Napolyon'un Mısır seferi","te":"Napoleon's campaign in Egypt","en":"French invasion of Egypt and Syria","f":"Sefere orduyla birlikte 150'den fazla bilim insanı ve sanatçı katıldı. Ünlü Rosetta Taşı bu sefer sırasında bulundu.","fe":"More than 150 scientists and artists went with the army. The famous Rosetta Stone was found during this campaign."},{"id":"piramit","y":-2560,"a":1,"t":"Keops Piramidi inşa ediliyor","te":"Great Pyramid of Giza built","en":"Great Pyramid of Giza","f":"Yaklaşık 3800 yıl boyunca dünyanın en yüksek insan yapımı yapısı olarak kaldı. Kleopatra yaşarken bile piramit 2500 yaşındaydı.","fe":"It was the tallest human-made structure in the world for about 3,800 years. Even in Cleopatra's time the pyramid was already about 2,500 years old."},{"id":"bagdat","y":1258,"t":"Moğolların Bağdat'ı yağmalaması","te":"Mongols sack Baghdad","en":"Siege of Baghdad (1258)","f":"Hülagü Han komutasındaki Moğollar Abbasi Halifeliği'ne son verdi. Beytülhikme'deki kitapların Dicle'ye atıldığı ve nehrin mürekkepten karardığı anlatılır.","fe":"Hulagu Khan's Mongols ended the Abbasid Caliphate. Legend says so many books from the House of Wisdom were thrown into the Tigris that the river ran black with ink."},{"id":"veba","y":1347,"t":"Kara Veba","te":"Black Death","en":"Black Death","p":"Doutielt1.jpg","f":"Salgın ticaret gemileriyle Akdeniz limanlarına geldi. Birkaç yıl içinde Avrupa nüfusunun üçte biri ile yarısı arasında bir kısmı hayatını kaybetti.","fe":"The plague arrived in Mediterranean ports on trading ships. Within a few years, somewhere between a third and half of Europe's population died."},{"id":"tacmahal","y":1643,"a":1,"t":"Tac Mahal tamamlanıyor","te":"Taj Mahal completed","en":"Taj Mahal"},{"id":"gaugamela","y":-331,"t":"Gaugamela Muharebesi","te":"Battle of Gaugamela","en":"Battle of Gaugamela","f":"İskender sayıca çok daha büyük Pers ordusunu yendi ve Pers İmparatorluğu'nun sonunu getirdi. O sırada 25 yaşındaydı.","fe":"Alexander beat a much larger Persian army and brought down the Persian Empire. He was 25 at the time."},{"id":"kudus","y":1099,"t":"Haçlıların Kudüs'ü alması","te":"Crusaders take Jerusalem","en":"Siege of Jerusalem (1099)","f":"Birinci Haçlı Seferi'nin sonunda kent alındı ve Kudüs Krallığı kuruldu. Kenti 1187'de Selahaddin Eyyubi geri aldı.","fe":"The First Crusade ended with the capture of the city and the founding of the Kingdom of Jerusalem. Saladin retook it in 1187."},{"id":"selimiye","y":1575,"t":"Selimiye Camii tamamlanıyor","te":"Selimiye Mosque completed","en":"Selimiye Mosque","p":"Edirne Selimiye Mosque Exterior NW corner in 2017 3147.jpg","f":"Sinan bu eseri \"ustalık eserim\" diye tanımlar. Camiyi bitirdiğinde 80 yaşını geçmişti.","fe":"Sinan called it his masterpiece. He was over 80 when it was finished."},{"id":"piri","y":1513,"t":"Piri Reis haritasını çiziyor","te":"Piri Reis draws his map","en":"Piri Reis map","f":"Harita, Amerika kıtasını gösteren günümüze ulaşmış en eski haritalardan biri. 1929'da Topkapı Sarayı'nda yeniden bulundu.","fe":"It is one of the oldest surviving maps to show the Americas. It was rediscovered in Topkapı Palace in 1929."},{"id":"mayflower","y":1620,"t":"Mayflower","te":"Mayflower voyage","en":"Mayflower","f":"Gemi yaklaşık 100 yolcuyu İngiltere'den Kuzey Amerika'ya taşıdı. Yolculuk iki aydan uzun sürdü ve yolcuların yarısı ilk kışı göremedi.","fe":"The ship carried about 100 passengers from England to North America. The crossing took more than two months, and half the passengers did not survive the first winter."},{"id":"mohac","y":1526,"t":"Mohaç Meydan Muharebesi","te":"Battle of Mohács","en":"Battle of Mohács","f":"Savaş yaklaşık iki saat sürdü. Macar Kralı II. Layoş kaçarken bir derede boğuldu.","fe":"The battle lasted about two hours. King Louis II of Hungary drowned in a stream while fleeing."},{"id":"preveze","y":1538,"t":"Preveze Deniz Muharebesi","te":"Battle of Preveza","en":"Battle of Preveza","f":"Bu zafer Akdeniz'de uzun süre Osmanlı üstünlüğünü sağladı. 27 Eylül bugün Türk Deniz Kuvvetleri Günü olarak kutlanıyor.","fe":"The victory secured Ottoman dominance in the Mediterranean for decades. 27 September is still Turkish Navy Day."},{"id":"inebahti","y":1571,"t":"İnebahtı Deniz Muharebesi","te":"Battle of Lepanto","en":"Battle of Lepanto"},{"id":"hastings","y":1066,"t":"Hastings Muharebesi","te":"Battle of Hastings","en":"Battle of Hastings"},{"id":"agincourt","y":1415,"t":"Agincourt Muharebesi","te":"Battle of Agincourt","en":"Battle of Agincourt"},{"id":"armada","y":1588,"t":"İspanyol Armadası","te":"Spanish Armada","en":"Spanish Armada","p":"Loutherbourg-Spanish Armada.jpg"},{"id":"londra","y":1666,"t":"Büyük Londra Yangını","te":"Great Fire of London","en":"Great Fire of London"},{"id":"bostoncay","y":1773,"t":"Boston Çay Partisi","te":"Boston Tea Party","en":"Boston Tea Party"},{"i function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seededShuffle = (arr, rand) => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(rand()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };

}

function burst(x, y, n=60){
  if(reduced) return;
  const c = $('fx'), ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
  c.hidden = false; c.width = innerWidth*dpr; c.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols = ['#3B5BFF','#FFC53D','#0E9F63','#F0506E','#9DB4FF'];
  const ps = Array.from({length:n}, () => { const a = Math.random()*Math.PI*2, v = 2 + Math.random()*6; return { x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 3, life:1, d:.014 + Math.random()*.012, s:2 + Math.random()*3.5, r:Math.random()*6, c:cols[rnd(cols.length)] }; });
  const step = () => { ctx.clearRect(0,0,innerWidth,innerHeight); let alive = false;
    ps.forEach(p => { p.vy += .2; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.life -= p.d; p.r += .2;
      if(p.life > 0){ alive = true; ctx.globalAlpha = Math.min(1, p.life*1.4); ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6); ctx.restore(); } });
    if(alive) requestAnimationFrame(step); else { ctx.clearRect(0,0,innerWidth,innerHeight); c.hidden = true; } };
  requestAnimationFrame(step);
}

const BAD_FILE = /\.svg$|map|logo|flag_of|coat_of_arms|locator|diagram|seal_of|signature/i;
const META = {}, metaWait = {};
async function fetchMeta(evs){
  const need = evs.filter(e => !META[e.id] && !metaWait[e.id]);
  if(!need.length) return;
  const url = 'https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1'
    + '&prop=pageimages|langlinks&piprop=thumbnail|name&pithumbsize=800&lllang=tr&lllimit=max&titles='
    + encodeURIComponent(need.map(e => e.en).join('|'));
  const job = (async () => {
    const r = await fetch(url); if(!r.ok) throw new Error('api');
    const j = await r.json();
    const pages = {}; (j.query.pages||[]).forEach(p => pages[p.title] = p);
    const hop = {}; (j.query.normalized||[]).concat(j.query.redirects||[]).forEach(n => hop[n.from] = n.to);
    const resolve = t => { for(let i=0;i<4 && hop[t];i++) t = hop[t]; return t; };
    need.forEach(e => {
      const p = pages[resolve(e.en)];
      const m = { img:null, file:null, tr: p && p.langlinks && p.langlinks[0] ? p.langlinks[0].title : null, enPage: p && !p.missing ? p.title : e.en };
      if(e.p){ m.file = e.p.replace(/ /g,'_'); m.img = `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(m.file)}?width=800`; }
      else if(p && p.thumbnail && p.pageimage && !(BAD_FILE.test(p.pageimage) && e.id !== 'piri')){ m.img = p.thumbnail.source; m.file = p.pageimage; }
      META[e.id] = m;
    });
  })();
  need.forEach(e => metaWait[e.id] = job);
  try{ await job; }catch(err){ need.forEach(e => delete metaWait[e.id]); throw err; }
}
async function metaFor(ev){ if(META[ev.id]) return META[ev.id]; if(metaWait[ev.id]){ try{ await metaWait[ev.id]; }catch(e){} } if(!META[ev.id]) await fetchMeta([ev]); return META[ev.id]; }
const infoCache = {};
function getInfo(ev){
  const key = ev.id + ':' + lang;
  if(infoCache[key]) return infoCache[key];
  const lg = lang;
  infoCache[key] = (async () => {
    const m = await metaFor(ev).catch(() => null) || {};
    const tryOne = async (host, t) => {
      const r = await fetch(`https://${host}/api/rest_v1/page/summary/${encodeURIComponent(t.replace(/ /g,'_'))}`);
      if(!r.ok) throw new Error('sum'); const j = await r.json();
      return { text:j.extract || '', url:(j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page) || `https://${host}/wiki/${encodeURIComponent(t)}`, native: lg === 'en' || host.startsWith('tr') };
    };
    if(lg === 'tr' && m.tr){ try{ return await tryOne('tr.wikipedia.org', m.tr); }catch(e){} }
    try{ return await tryOne('en.wikipedia.org', m.enPage || ev.en); }catch(e){}
    return { text:'', url:`https://en.wikipedia.org/wiki/${encodeURIComponent(ev.en)}`, native: lg === 'en' };
  })();
  return infoCache[key];
}
const trimText = (t, max) => { if(t.length <= max) return t; const c = t.slice(0, max), i = c.lastIndexOf('. '); return i > max*.4 ? c.slice(0, i+1) : c + '…'; };

function fillImg(box, ev){
  const token = ev.id; box.dataset.id = token;
  box.querySelectorAll('img').forEach(i => i.remove());
  box.classList.add('empty'); box.classList.remove('noimg');
  const apply = m => {
    if(box.dataset.id !== token) return;
    if(!m || !m.img){ box.classList.add('noimg'); box.classList.remove('empty'); return; }
    const im = new Image(); im.alt = ''; im.draggable = false;
    im.onload = () => { if(box.dataset.id !== token) return; box.classList.remove('empty'); box.append(im); };
    im.onerror = () => { if(box.dataset.id === token){ box.classList.remove('empty'); box.classList.add('noimg'); } };
    im.src = m.img;
  };
  if(META[ev.id]) apply(META[ev.id]); else metaFor(ev).then(apply).catch(() => apply(null));
}
function cardEl(ev, big, tag='div'){

}

  store.set(dKey(G.day), JSON.stringify({ res: G.results.map(r => [r.id, r.ok ? 1 : 0]), done: G.over }));
}
function correctIndex(T, y){ let i = 0; while(i < T.length && T[i].y <= y) i++; return i; }
function fits(T, slot, y){ const lo = slot > 0 ? T[slot-1].y : -Infinity, hi = slot < T.length ? T[slot].y : Infinity; return lo <= y && y <= hi; }
function newGame(mode, deck, lives, extra){
  G = { mode, deck, di:1, lives, maxLives:lives, T:[{ ...deck[0], anchor:true }], results:[], cur:null, sel:null, phase:'pick', over:false, ...extra };
}
function busy(on, msg='', err=false){
  ['dailyBtn','freeBtn'].forEach(id => $(id).disabled = on);
  const st = $('status'); st.className = 'status' + (err ? ' err' : ''); st.textContent = msg; $('loadbar').hidden = !on;
}
async function primeDeck(){
  await fetchMeta(G.deck.slice(0, 12));
  const rest = G.deck.slice(12);
  (async () => { for(let i=0;i<rest.length;i+=40){ try{ await fetchMeta(rest.slice(i, i+40)); }catch(e){} } })();
}
async function startDaily(){
  const k = dayKey(), prog = loadDaily(k), deck = dailyDeck(k);
  newGame('daily', deck, 3, { day:k, no:dayNo(k) });
  if(prog && prog.res && prog.res.length){
    const byId = Object.fromEntries(EVENTS.map(e => [e.id, e]));
    prog.res.forEach(([id, ok]) => { const ev = byId[id]; if(!ev) return; G.T.splice(correctIndex(G.T, ev.y), 0, { ...ev, ok:!!ok }); G.results.push({ id, ok:!!ok }); if(!ok) G.lives--; });
    G.di = 1 + G.results.length;
    if(prog.done || G.lives <= 0 || G.di >= deck.length){ G.over = true; G.deckOut = G.di >= deck.length; showOver(true); fetchMeta(G.T).then(() => { if(!$('over').hidden) renderList(); }).catch(()=>{}); return; }
  }
  busy(true, L().loading);
  try{ await primeDeck(); busy(false); sfx.start(); nextCard(); }
  catch(e){ busy(false, L().loadErr, true); }
}
async function startFree(){
  const seen = new Set(recent());
  const pool = shuffle(EVENTS);
  const deck = pool.filter(e => !seen.has(e.id)).concat(pool.filter(e => seen.has(e.id)));
  newGame('free', deck, 3, {});
  show('start'); busy(true, L().loading);
  try{ await primeDeck(); busy(false); sfx.start(); nextCard(); }
  catch(e){ busy(false, L().loadErr, true); }
}

// ---------- PLAY ----------
function modeName(){ return G.mode === 'daily' ? L().dailyTag(G.no) : L().quick; }
function nextCard(){
  if(G.di >= G.deck.length){ G.over = true; G.deckOut = true; saveDaily(); return showOver(true); }
  clearTimeout(G.timer); G.cur = G.deck[G.di]; G.sel = null; G.phase = 'pick'; G.lastPlaced = null; G.res = null;
  if(G.mode === 'free') rememberSeen([G.cur.id]);
  G.deck.slice(G.di + 1, G.di + 3).forEach(ev => metaFor(ev).then(m => { if(m && m.img) loadImg(m.img).catch(()=>{}); }).catch(()=>{}));
  fetchMeta(G.deck.slice(G.di, G.di + 12)).catch(()=>{});
  if($('play').hidden) show('play');
  renderAll(true);
}
function renderHud(){
  const h = $('hearts'); h.innerHTML = '';
  for(let i=0;i<G.maxLives;i++) h.append(el('i', i < G.lives ? '' : 'off', '♥'));
  h.setAttribute('aria-label', `${G.lives}/${G.maxLives}`);
  const s = $('scoreTxt'); s.innerHTML = ''; s.append(String(okCount()), el('span', null, L().pts));
  $('modeTag').textContent = modeName();
  $('tlCount').textContent = L().tlCount(G.T.length);
}
function renderAll(fresh){ renderHud(); renderStage(fresh); renderRow(); }

function renderStage(fresh){
  const st = $('stage'); st.innerHTML = '';
  if(G.phase === 'pick'){
    const hand = el('div', 'hand' + (fresh ? ' draw' : '')); hand.id = 'hand';
    hand.append(cardEl(G.cur, true));
    st.append(hand);
    if(G.sel == null) st.append(el('p', 'hint', L().hint));
    else{ const b = el('button', 'btn', L().place); b.id = 'placeBtn'; b.onclick = place; st.append(b); }
    bindDrag(hand);
    return;
  }
  const ev = G.cur, ok = G.res.ok, box = el('div', 'res quick ' + (ok ? 'okc' : 'badc'));
  box.append(el('span', 'badge ' + (ok ? 'ok' : 'bad'), ok ? L().okToast : L().badToast), el('h3', null, title(ev)));
  if(!ok) box.append(el('div', 'big-y bad', fmtY(ev.y, ev.a)), el('p', 'sub', L().badLine(fmtY(ev.y, ev.a))));
  const bar = el('div', 'bar'); bar.append(el('i')); bar.style.setProperty('--wait', G.wait + 'ms'); box.append(bar);
  box.title = L().tapNext; box.onclick = advance;
  st.append(box);
}

function renderRow(){
  const row = $('trow'); row.innerHTML = '';
  const T = G.T, picking = G.phase === 'pick';
  row.classList.toggle('locked', !picking);
  const gap = i => {
    const b = el('button', 'gap' + (G.sel === i ? ' on' : '')); b.type = 'button'; b.dataset.i = i;
    b.setAttribute('aria-label', L().gapLbl(T[i-1] && title(T[i-1]), T[i] && title(T[i])));
    b.append(el('i', null, '+'), el('span', 'ghost', G.cur ? title(G.cur) : ''));
    if(picking) b.onclick = () => selectSlot(i); else b.tabIndex = -1;
    return b;
  };
  T.forEach((ev, i) => {
    row.append(gap(i));
    const it = el('div', 'titem' + (ev.id === G.lastPlaced ? ' new ' + (ev.ok ? 'ok' : 'bad') : ''));
    it.dataset.id = ev.id;
    const c = cardEl(ev, false, 'button'); c.type = 'button'; c.onclick = () => openDetail(ev);
    const hide = ev.id === G.lastPlaced && G.phase === 'year';
    const pill = el('div', 'ypill' + (hide ? ' q' : ev.ok === true ? ' ok' : ev.ok === false ? ' bad' : ''), hide ? '?' : fmtY(ev.y, ev.a));
    it.append(c, pill); row.append(it);
  });
  row.append(gap(T.length));
}
function scrollToItem(sel, center=true){
  const w = $('rowwrap'), t = $('trow').querySelector(sel); if(!t) return;
  const wr = w.getBoundingClientRect(), tr = t.getBoundingClientRect();
  const target = w.scrollLeft + (tr.left - wr.left) - (center ? (wr.width - tr.width)/2 : 0);
  w.scrollTo({ left: Math.max(0, target), behavior: reduced ? 'auto' : 'smooth' });
}
function selectSlot(i){
  if(!G || G.phase !== 'pick') return;
  if(G.sel === i) return place();
  G.sel = i; sfx.select();
  document.querySelectorAll('#trow .gap').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  const st = $('stage'), hint = st.querySelector('.hint');
  if(hint){ const b = el('button', 'btn', L().place); b.id = 'placeBtn'; b.onclick = place; hint.replaceWith(b); }
  setTimeout(() => scrollToItem(`.gap[data-i="${i}"]`), 230);
}
function place(){
  if(!G || G.phase !== 'pick' || G.sel == null) return;
  const ev = G.cur, ok = fits(G.T, G.sel, ev.y);
  sfx.place();
  const at = ok ? G.sel : correctIndex(G.T, ev.y);
  G.T.splice(at, 0, { ...ev, ok });
  const res = { id:ev.id, ok }; G.results.push(res); G.res = res;
  G.lastPlaced = ev.id; G.sel = null; G.phase = 'result';
  if(!ok){ G.lives--; if(G.lives <= 0) G.over = true; }
  G.wait = ok ? 850 : (G.lives <= 0 ? 2200 : 2000);
  saveDaily(); renderAll();
  if(!ok){ const h = $('hearts').querySelectorAll('i'); if(h[G.lives]) h[G.lives].classList.add('lost'); }
  setTimeout(() => ok ? sfx.ok() : sfx.bad(), 100);
  if(ok){ const t = document.querySelector(`#trow .titem[data-id="${CSS.escape(ev.id)}"] .gcard`); if(t) setTimeout(() => { const rc = t.getBoundingClientRect(); burst(rc.left + rc.width/2, rc.top + rc.height/3, 26); }, 280); }
  setTimeout(() => scrollToItem(`.titem[data-id="${CSS.escape(ev.id)}"]`), 260);
  G.timer = setTimeout(advance, G.wait);
}
function advance(){
  if(!G || G.phase !== 'result') return;
  clearTimeout(G.timer);
  if(G.lives <= 0) return showOver(true);
  G.di++;
  if(G.di >= G.deck.length){ G.over = true; G.deckOut = true; saveDaily(); return showOver(true); }
  nextCard();
}

// ---------- DRAG & DROP ----------
function bindDrag(hand){
  let ghost = null, start = null, raf = 0, lastX = 0, lastY = 0, overRow = false;
  const wrap = $('rowwrap');
  const indexAt = x => {
    const items = [...document.querySelectorAll('#trow .titem')];
    let i = 0; for(const it of items){ const r = it.getBoundingClientRect(); if(x > r.left + r.width/2) i++; }
    return i;
  };
  const loop = () => {
    if(!ghost) return;
    const r = wrap.getBoundingClientRect();
    if(overRow){ if(lastX < r.left + 70) wrap.scrollLeft -= 10; else if(lastX > r.right - 70) wrap.scrollLeft += 10; }
    raf = requestAnimationFrame(loop);
  };
  const move = e => {
    if(!start) return;
    lastX = e.clientX; lastY = e.clientY;
    if(!ghost){
      if(Math.hypot(e.clientX - start.x, e.clientY - start.y) < 8) return;
      ghost = el('div', 'drag-ghost'); ghost.append(cardEl(G.cur, true)); document.body.append(ghost);
      hand.classList.add('lifted'); wrap.classList.add('dragging'); sfx.pick();
      raf = requestAnimationFrame(loop);
    }
    ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    const r = wrap.getBoundingClientRect();
    overRow = e.clientY > r.top - 90 && e.clientY < r.bottom + 40;
    if(overRow){
      const i = indexAt(e.clientX);
      if(i !== G.sel){ G.sel = i; document.querySelectorAll('#trow .gap').forEach(b => b.classList.toggle('on', +b.dataset.i === i)); sfx.select(); }
    }else if(G.sel != null){ G.sel = null; document.querySelectorAll('#trow .gap.on').forEach(b => b.classList.remove('on')); }
  };
  const end = e => {
    if(!start) return;
    const dragged = !!ghost; start = null;
    cancelAnimationFrame(raf);
    if(ghost){ ghost.remove(); ghost = null; }
    hand.classList.remove('lifted'); wrap.classList.remove('dragging');
    if(!dragged){ const im = hand.querySelector('.im img'); if(im && e.type === 'pointerup' && e.target.closest && e.target.closest('.im')){ $('lbImg').src = im.src; $('lightbox').hidden = false; } return; }
    if(overRow && G.sel != null) place();
    else { G.sel = null; renderStage(); renderRow(); }
  };
  hand.addEventListener('pointerdown', e => { if(e.button || G.phase !== 'pick') return; start = { x:e.clientX, y:e.clientY }; hand.setPointerCapture(e.pointerId); });
  hand.addEventListener('pointermove', move);
  hand.addEventListener('pointerup', end);
  hand.addEventListener('pointercancel', end);
}

// ---------- OVER ----------
function tickCountdown(){
  const now = new Date(), next = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
  const s = Math.max(0, Math.floor((next - now)/1000));
  $('countdown').textContent = `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`;
}
function squaresText(){ const sqs = G.results.map(sq); const rows = []; for(let i=0;i<sqs.length;i+=10) rows.push(sqs.slice(i,i+10).join('')); return rows.join('\n'); }
function renderList(){
  const ol = $('overList'); ol.innerHTML = '';
  G.T.forEach(ev => {
    const li = el('li'), b = el('button'); b.type = 'button'; b.onclick = () => openDetail(ev);
    const th = el('img', 'th'); th.alt = ''; th.loading = 'lazy'; th.style.setProperty('--tint', kindOf(ev).tint);
    if(META[ev.id] && META[ev.id].img) th.src = META[ev.id].img; else th.removeAttribute('src');
    const nm = el('div', 'nm', title(ev)); nm.append(el('small', null, ev.anchor ? L().anchor : L().kinds[kindOf(ev).id]));
    b.append(th, nm, el('span', 'ypill' + (ev.ok === true ? ' ok' : ev.ok === false ? ' bad' : ''), fmtY(ev.y, ev.a)));
    li.append(b); ol.append(li);
  });
}
function showOver(first){
  const n = okCount(), p = n;
  if(first){
    G.over = true; G.phase = 'over'; G.cur = null; G.lastPlaced = null;
    if(G.mode === 'daily'){ saveDaily(); bumpStreak(G.day); }
    else{ const k = 'ykt-best-quick', prev = +(store.get(k) || 0); G.prevBest = prev; if(p > prev) store.set(k, p); }
    sfx.over();
  }
  $('overHead').textContent = modeName();
  $('bigTotal').innerHTML = ''; $('bigTotal').append(String(p), el('small', null, L().total(n)));
  $('squares').textContent = squaresText();
  const deckMsg = G.deckOut ? L().overDeck + ' ' : '';
  if(G.mode === 'daily'){
    $('overNote').textContent = deckMsg + L().tomorrow;
    $('overStreak').textContent = L().streak(getStreak().n);
    $('dailyBox').hidden = false; $('againBtn').textContent = L().freeAgain;
    tickCountdown(); clearInterval(countdownTimer); countdownTimer = setInterval(tickCountdown, 1000);
  }else{
    $('dailyBox').hidden = true; $('againBtn').textContent = L().again;
    $('overNote').textContent = deckMsg + (p > G.prevBest && G.prevBest > 0 ? L().newBest(G.prevBest) : L().bestIs(Math.max(p, G.prevBest || 0)));
  }
  renderList();
  if(first){ $('copied').textContent = ''; show('over'); }
}
function shareText(){
  const url = /^https?:/.test(location.protocol) ? '\n' + location.origin + location.pathname : '';
  const head = G.mode === 'daily' ? `${L().shareHead} #${G.no}` : `${L().shareHead} (${L().quick.toLocaleLowerCase(lang)})`;
  const st = G.mode === 'daily' ? getStreak().n : 0;
  return `${head}\n${L().shareScore(okCount())}\n${squaresText()}${st > 1 ? '\n' + L().streak(st) : ''}${url}`;
}

// ---------- DETAIL ----------
let detailEv = null;
function openDetail(ev){
  detailEv = ev; $('detail').hidden = false;
  const pic = $('dPic'); pic.querySelectorAll('img').forEach(i => i.remove()); pic.querySelector('.blur').style.backgroundImage = '';
  metaFor(ev).then(m => { if(detailEv !== ev || !m || !m.img) return; const im = new Image(); im.alt = ''; im.onload = () => { if(detailEv === ev){ pic.querySelector('.blur').style.backgroundImage = `url("${m.img}")`; pic.append(im); } }; im.src = m.img; }).catch(()=>{});
  $('dYear').textContent = fmtY(ev.y, ev.a);
  $('dTitle').textContent = title(ev);
  const f = $('dFact'); f.hidden = !fact(ev); f.textContent = fact(ev) || '';
  const ex = $('dExtract'); ex.textContent = L().loadingInfo; ex.hidden = false;
  const w = $('dWiki'); w.hidden = true;
  const cr = $('dCredit'); cr.hidden = true; cr.textContent = L().source;
  metaFor(ev).then(m => { if(detailEv === ev && m && m.file){ cr.href = `https://commons.wikimedia.org/wiki/File:${encodeURIComponent(m.file)}`; cr.hidden = false; } }).catch(()=>{});
  getInfo(ev).then(info => { if(detailEv !== ev) return; ex.textContent = info.text ? trimText(info.text, 600) : ''; ex.hidden = !info.text; w.href = info.url; w.textContent = info.native ? L().readWiki : L().readWikiEn; w.hidden = false; });
  $('dClose').focus({ preventScroll:true });
}
function closeDetail(){ $('detail').hidden = true; detailEv = null; }

// ---------- MENU ----------
function renderMenu(){
  const k = dayKey(), prog = loadDaily(k), st = getStreak();
  $('dHead').textContent = L().dailyTag(dayNo(k));
  const ds = $('dState'), db = $('dailyBtn'); ds.innerHTML = '';
  const res = prog && prog.res ? prog.res : [];
  const wrong = res.filter(r => !r[1]).length;
  if(prog && (prog.done || wrong >= 3)){
    const pts = res.filter(r => r[1]).length;
    const sqs = res.map(r => sq({ ok:!!r[1] }));
    const [a, b, c] = L().dailyDone(pts, sqs.slice(0, 20).join('') + (sqs.length > 20 ? '…' : ''));
    ds.append(a, el('b', null, b), c); db.textContent = L().seeRes;
  }else if(res.length){ ds.textContent = L().dailyResume(res.length); db.textContent = L().resume; }
  else{ ds.textContent = L().dailyNew; db.textContent = L().playDaily; }
  $('streakLine').textContent = st.n ? L().streak(st.n) : '';
  $('freeBtn').textContent = L().quick;
  const best = +(store.get('ykt-best-quick') || 0);
  $('bestLine').textContent = best ? L().best(best) : L().quickDesc;
}
function goMenu(){ if(G) clearTimeout(G.timer); closeDetail(); busy(false); renderMenu(); show('start'); }

// ---------- LANGUAGE & SOUND ----------
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>';
function updateSound(){ const b = $('soundBtn'); b.innerHTML = soundOn ? ICON_ON : ICON_OFF; b.setAttribute('aria-pressed', soundOn); b.setAttribute('aria-label', soundOn ? L().soundOn : L().soundOff); b.title = soundOn ? L().soundOn : L().soundOff; }
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(e => { const v = L()[e.dataset.t]; if(typeof v === 'string') e.textContent = v; });
  document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  updateSound(); renderMenu();
  if(G && !$('play').hidden && G.cur){ renderHud(); renderStage(); renderRow(); }
  if(G && !$('over').hidden) showOver(false);
  if(detailEv) openDetail(detailEv);
  const st = $('status'); if(st.textContent && !st.classList.contains('err')) st.textContent = L().loading;
}

// ---------- WIRING ----------
$('dailyBtn').onclick = startDaily;
$('freeBtn').onclick = startFree;
$('againBtn').onclick = () => G && G.mode === 'daily' ? goMenu() : startFree();
$('menuBtn').onclick = goMenu;
$('brand').onclick = goMenu;
$('soundBtn').onclick = () => { soundOn = !soundOn; store.set('ykt-sound', soundOn ? 'on' : 'off'); updateSound(); };
document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set('ykt-lang', lang); applyLang(); });
$('lightbox').onclick = () => $('lightbox').hidden = true;
$('dClose').onclick = closeDetail;
$('detail').onclick = e => { if(e.target === $('detail')) closeDetail(); };
$('shareBtn').onclick = async () => {
  const t = shareText();
  try{ await navigator.clipboard.writeText(t); $('copied').textContent = L().copied; }catch(e){ $('copied').textContent = t; }
};
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ if(!$('lightbox').hidden) $('lightbox').hidden = true; else if(!$('detail').hidden) closeDetail(); return; }
  if(!G || $('play').hidden || !$('detail').hidden) return;
  const a = document.activeElement;
  if(G.phase === 'pick' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    e.preventDefault();
    const max = G.T.length; let i = G.sel == null ? (e.key === 'ArrowRight' ? 0 : max) : G.sel + (e.key === 'ArrowRight' ? 1 : -1);
    selectSlot(Math.max(0, Math.min(max, i)));
  }
  if(e.key === 'Enter'){
    if(a && (a.tagName === 'A' || a.tagName === 'BUTTON')) return;
    e.preventDefault();
    if(G.phase === 'pick') place(); else advance();
  }
});
applyLang();
</script>
